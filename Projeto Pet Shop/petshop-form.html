<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Formulário </title>

<header>
        <nav>
            <img class="logo" src="img/pet-logo.jpg" alt="Logo do Pet Shop" >
            <ul>
                <li><a href="">Início</a></li>
                <li><a href="">Serviços</a></li>
                <li><a href="">Sobre nós</a></li>
                <li><a href="">Contatos</a></li>
            </ul>
        </nav>
</header>


<body>
    <section class="contato">
        <h1>Fale Conosco</h1>

    </section>

    <section class="forms"></section>
    <form action="/submit" method="post">

        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="senha">Mensagem:</label>
        <textarea id="mensagem" name="senha" required></textarea><br><br>

        <input type="submit" value="Enviar">
    </form>
    <h2>Ou fale diretamente pelo Whatsapp</h2>

    <section class="zap">
        <img class="logo" src="img/whatsapp.jpg" alt="Imagem do App Whatsapp" >
        Enviar mensagem no Whatsapp
    </section>

</body>

    <footer>
        <br><br>
        <p class="final">© 2024 PetShop Alegria Animal Todos os direitos reservados</p>
    </footer>
</html>
