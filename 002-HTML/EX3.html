<!DOCTYPE HTML>
<html lang="PT-BR">
    <head>
    <meta charset="UTF-8">
        <!--Responsividade dos itens, manter os itens em tamanho natural-->
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Trabalhando com Tabelas</title>
</head>
<body>
    <header>
        <h1>
            <center>Trabalhando com Tabelas</center>
        </h1>
    </header>
    <main>
        <div>
            <h2>
                <center>Tabela de Eletrônicos</center>
            </h2>
            <!--Tabelas HTML-->
            <ul>
                <center>
                <table border="1"> 
                    <tr> <!-- Cabeçalho da tabela--> 
                        <th bgcolor="Yellow">Produto</th>
                        <th bgcolor="Yellow">Preço</th>
                        <th bgcolor="Yellow">Quantidade</th>
                    <tr>
                    <tr>
                        <td>Notebook Samsung Book 4</td>
                        <td align="center">R$ 4.200,30</td>
                        <td align="center">50</td>
                    </tr>
                    <tr>
                        <td>Galaxy Watch 8 Classic</td>
                        <td align="center">R$ 8.200,30</td>
                        <td align="center">20</td>
                    </tr>
                    <tr>
                        <td>Labasi-Marduk J2</td>
                        <td align="center">R$ 3.100,90</td>
                        <td align="center">80</td>
                    </tr>
                    <tr>
                        <td>Demiurge Note 4</td>
                        <td align="center">R$ 1.999,99</td>
                        <td align="center">100</td>
                    </tr>
                    <tr>
                        <td>Bicicleta  Samsung Kleiton Ilimited Edition</td>
                        <td align="center">R$ 2,00</td>
                        <td align="center">1</td>
                    </tr>
                </table>
                </center>
            </ul>
        </div>
    </main>
<body>
</html>
