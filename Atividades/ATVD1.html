<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" contant="width=device-width, initial-scale=1.0">
    <title>Perfil do Usuário</title>
    <center>
    <h2>Bem vindo(a) ao perfil de Luva de Pedreiro! =)<br><br>
        </center></h2>
    
    <center>
    <h4>Foto do Usuário:</h4></center>
    <center>
    <img src="img\5.jpg" alt="Foto do Usuário"></center>
    
</head>
<body>
    
    <h2>Informações Básicas:</h2>
    <form action="/submit" method="POST">
         <label for="nome">Nome :</label>
        <input type="text" id="nome" name="nome"><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" ><br><br>

        <label for="data-nascimento"  >Data de Nascimento</label>
        <input type="date" id="data-nascimento" name="data-nascimento"><br><br>

        <label for="cidade">Cidade:</label>
        <select name="cidade" id="cidade" required>
            <option value="sp">São Paulo</option>
            <option value="fsa">Feira de Santana</option>
            <option value="rj">Rio de Janeiro</option>
            <option value="bh">Belo Horizonte</option>
            <option value="pa">Porto Alegre</option>
            <option value="ft">Fortaleza</option>
            <option value="Cç">Cabuçu</option>
            <option value="fp">Florianópolis</option>
        </select><br><br>

        <label for="interesses">Interesses:</label><br>
        <input type="checkbox" id="tecnologia" name="interesses" value="tecnologia">
        <label for="tecnologia">Tecnologia</label><br>
        <input type="checkbox" id="musica" name="interesses" value="musica">
        <label for="musica">Música</label><br>
        <input type="checkbox" id="esportes" name="interesses" value="esportes">
        <label for="esportes">Esportes</label><br>
        <input type="checkbox" id="jogos" name="interesses" value="jogos">
        <label for="jogos">Jogos</label><br>
        <input type="checkbox" id="cinema" name="interesses" value="cinema">
        <label for="cinema">Cinema</label><br><br>

        <input type="submit" value="Editar Perfil">
    </form> 
</body>
