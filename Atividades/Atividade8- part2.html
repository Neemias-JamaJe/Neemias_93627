<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" contant="width=device-width, initial-scale=1.0">
    <title>Luva Sports: produtos esportivos</title>
    <img src="img\8.jpg" width="100px" height="100px" alt="Logo"> 
</head>
<body>
    <center><h1>Formulário</h1></center>

    <center><form action="/submit" method="post">

        <label for="nome">Nome Completo:</label>
        <input type="text" id="nome" name="nome" required><br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" required><br><br>

        <label for="telefone">Senha:</label>
        <input type="tel" id="telefone" name="telefone" required><br><br>

        <label for="produto">Produto:</label>
        <select name="produto" id="Produto" required>
            <option value="SM">	Setti Maris</option>
            <option value="Ep">Elapar Til U</option>
            <option value="DJ">Dandan J2 Prime</option>
            <option value="lp">Lopepel Pro</option>
            <option value="lu">Palmeirinha 10</option>
        </select><br><br>
        <label for="assunto">Assunto:</label><br>
            <input type="text" id="assunto" name="assunto" ><br><br>
        
        <label for="mensagem">Mensagem:</label><br>
            <textarea id="mensagem" name="mensagem" rows="5" cols="40"></textarea><br><br></center>

      <center><input type="submit" value="Enviar"></center>
      <center><input type="reset" value="Limpar"></center>
    </body>

</html>
