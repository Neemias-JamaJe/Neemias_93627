<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastrar Produto</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body class="bg-light">

<div class="container mt-5">
    <div class="card shadow p-4 mx-auto" style="max-width: 600px;">
        <h3 class="text-center mb-4">Cadastro de Produtos</h3>

        <form action="/cadastro" method="POST" id="formProduto">
            <div class="mb-3">
                <label class="form-label">Produto</label>
                <input type="text" class="form-control" name="nome" id="nome" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Preço</label>
                <input type="number" step="0.01" class="form-control" name="preco" id="preco" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Quantidade</label>
                <input type="number" class="form-control" name="quantidade" id="quantidade" required>
            </div>

            <button class="btn btn-primary w-100">Salvar no Carrinho</button>
        </form>

        <div class="text-center mt-3">
            <a href="{{ url_for('tabela') }}">Voltar</a>
        </div>
    </div>
</div>

<script>
document.getElementById("formProduto").addEventListener("submit", function(e) {
    if (preco.value <= 0 || quantidade.value <= 0) {
        alert("Preço e quantidade devem ser maiores que zero.");
        e.preventDefault();
    }
});
</script>

</body>
</html>
